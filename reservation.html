<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réservation — Montreal Rent Car</title><link rel="stylesheet" href="css/style.css"></head><body data-page="booking"><section class="pagehero"><div class="container"><div class="eyebrow">Réservation</div><h1>Votre demande de location</h1><p>Complétez les informations ci-dessous. Votre demande sera soumise à confirmation par l'agence.</p></div></section><section class="section container"><div class="panel"><div id="selectedcar"></div><form id="bookingform" class="formgrid"><div class="field full"><label>Véhicule souhaité</label><select id="car" name="car" required></select></div><div class="field"><label>Date et heure de retrait</label><input id="pickup" type="datetime-local" name="pickup" required></div><div class="field"><label>Date et heure de retour</label><input id="return" type="datetime-local" name="return" required></div><div class="field"><label>Lieu de retrait</label><input name="pickupLocation" value="Tanger" required></div><div class="field"><label>Lieu de retour</label><input name="returnLocation" value="Tanger" required></div><div class="field"><label>Prénom</label><input name="first" required></div><div class="field"><label>Nom</label><input name="last" required></div><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Téléphone</label><input name="phone" required></div><div class="field"><label>Pays</label><input name="country"></div><div class="field"><label>Ville</label><input name="city"></div><div class="field"><label>Numéro de vol (si applicable)</label><input name="flight"></div><div class="field full"><label>Demandes particulières / commentaires</label><textarea name="notes"></textarea></div><div class="full"><button class="btn">Envoyer ma demande</button></div></form><div id="bookingresult"></div></div></section><script src="js/store.js"></script><scrip
